packages:
  - packages/**
  - docs
  - e2e/**
  - benchmark/**

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

blockExoticSubdeps: true

overrides:
  yuku-analyzer: ^0.19.0
  easy-template-x>lodash.get: npm:lodash@^4.18.1
  easy-template-x-angular-expressions>lodash.get: npm:lodash@^4.18.1

catalog:
  tsdown: ^0.23.5
  typescript: ^7.0.2
  xmlbuilder2: ^4.0.3
  pdf-lib: ^1.17.1

catalogs:
  vitest:
    "@vitest/coverage-istanbul": ^5.1.0
    "@vitest/ui": ^5.1.0
    vitest: ^5.1.0

minimumReleaseAgeExclude:
  - miniflare@5.20260730.0-alpha
  - wrangler@4.118.0
  - tsx@4.23.8
  - '@node-zugferd/*'

trustPolicy: no-downgrade

patchedDependencies:
  easy-template-x-angular-expressions@0.3.0: patches/easy-template-x-angular-expressions@0.3.0.patch
  easy-template-x@8.0.1: patches/easy-template-x@8.0.1.patch
