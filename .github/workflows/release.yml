name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM || github.repository_owner }}
  TURBO_CACHE: remote:rw
  TURBO_FORCE: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: vars.APP_ID != ''
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - run: npx changelogithub
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Determine npm tag
        id: determine-npm-tag
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" =~ -(next|canary|beta|rc) ]]; then
              # Extract pre-release tag (e.g., beta, rc)
              NPM_TAG=${BASH_REMATCH[1]}
          else
              # Check if the commit is on the main branch or a version branch
              git fetch origin main
              CURRENT_BRANCH=$(git branch -r --contains "$GITHUB_SHA" | grep -E 'origin/(main|v[0-9]+\.x-latest)' | head -1 | sed 's/.*origin\///')

              if [[ "$CURRENT_BRANCH" == "main" ]]; then
                  NPM_TAG="latest"
              elif [[ "$CURRENT_BRANCH" =~ ^v[0-9]+\.[0-9]+\.x-latest$ ]]; then
                  # For version branches like v1.3.x-latest, v1.4.x-latest, use "latest" tag
                  NPM_TAG="latest"
              else
                  echo "The tagged commit is not on the main branch or a version branch (v*.*.x-latest)."
                  echo "::error ::Releases with the 'latest' npm tag must be on the main branch or a version branch."
                  exit 1
              fi
          fi
          echo "npm_tag=$NPM_TAG" >> $GITHUB_OUTPUT
          echo "Using npm tag: $NPM_TAG"

      - name: Publish to npm (staged)
        run: pnpm stage publish --recursive --access public --no-git-checks --tag ${{ steps.determine-npm-tag.outputs.npm_tag }}
